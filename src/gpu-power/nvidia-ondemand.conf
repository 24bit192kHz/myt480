# The MX150 is powered on demand: gpu-power loads the NVIDIA driver when a
# program wants the GPU (prime-run) and unloads it afterwards. Without a driver
# the GPU is off.
#
# "blacklist" keeps udev and modules-load from loading the driver at boot.
# "install" also stops nvidia-modprobe: the NVIDIA EGL/GLX libraries call it
# from any program that looks for a GPU (the X server does at startup), which
# would turn the GPU on for good. gpu-power loads with --ignore-install.
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
install nvidia /bin/false
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
install nvidia_uvm /bin/false
