<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
                "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  validity-rs serves io.github.uunicorn.Fprint.Device on its unique (root-owned)
  connection and registers the object with open-fprintd, which then calls the
  Device methods (VerifyStart, EnrollStart, Suspend, Resume, ...) on it. The
  system bus denies method calls by default, so this allow rule is required.

  Same policy as python-validity's io.github.uunicorn.Fprint.conf; shipped under
  its own name so it survives removing python-validity (and both packages can
  be installed side by side without a file conflict).
-->
<busconfig>
    <policy user="root">
        <!-- Allow open-fprintd service call our methods -->
        <allow send_interface="io.github.uunicorn.Fprint.Device"/>
    </policy>
</busconfig>
