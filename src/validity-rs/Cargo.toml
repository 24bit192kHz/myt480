[package]
name = "validity-rs"
version = "0.1.0"
edition = "2024"
description = "Synaptics/Validity 06cb:009a (ThinkPad T480) match-on-chip fingerprint daemon for open-fprintd"
license = "MIT"

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
hmac = "0.12"
libc = "0.2.189"
log = { version = "0.4", features = ["std"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
rand = "0.8"
rusb = "0.9"
serde = "1.0.229"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
