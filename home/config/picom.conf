shadow = false;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
frame-opacity = 0.9;
corner-radius = 0;

backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
unredir-if-possible = true;

# chadwm bar hover popups (bartip.c, class chadwm-tip): 25% transparent over
# a dual_kawase blur (downscale, blur, upscale in shaders on the iGPU: cheap
# even when strong). Only this window, only while a popup is open.
# xrender backend version without blur: ~/.local/share/backups/picom.conf.xrender-25pct-20261004
blur-method = "dual_kawase";
blur-strength = 2;
rules = (
  { match = "class_g = 'chadwm-tip'"; opacity = 0.75; blur-background = true; },
);
