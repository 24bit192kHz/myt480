<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>MesloLGS NF</family>
    <prefer>
      <family>MesloLGS Nerd Font</family>
      <family>MesloLGS Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>MesloLGS Nerd Font</family>
    <prefer>
      <family>MesloLGS NF</family>
      <family>MesloLGS Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias>
    <family>MesloLGS Nerd Font Mono</family>
    <prefer>
      <family>MesloLGS NF</family>
      <family>MesloLGS Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
