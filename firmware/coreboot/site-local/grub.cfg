# T480 GRUB menu (etc/grub.cfg), sourced by upstream GRUB's built-in
# coreboot.cfg. GRUB t480 branch: native NVMe, ms timeouts, lbmk PS/2 fix.
#
# Fast path: no menu, no graphics, no keyboard; the default kernel is read at
# once. The menu is shown on request only: CMOS 0x6e == 0xb5, set by coreboot
# after a power-button override (power held 4 s) or by `bootmenu` in Linux;
# coreboot normalises anything else to 0. Asking with a key is not possible:
# the EC keyboard only answers ~2.5 s after power-on (measured 2026-09-28),
# which would cost that on every boot.

insmod at_keyboard
insmod part_msdos
insmod ext2
terminal_input at_keyboard
terminal_output cbmemc

set menu=0
if cmostest 0x6e:0; then
	set menu=1
	cmosclean 0x6e:0
fi

set rootuuid="8036d9a5-01e6-4012-9e9f-c1eec4943fe7"
set cmdline_common="rw net.ifnames=0 panic=10 quiet loglevel=0 fbcon=nodefer vt.global_cursor_default=0 printk.devkmsg=off nowatchdog nmi_watchdog=0 8250.nr_uarts=0 iomem=relaxed thinkpad_acpi.force_load=1 thinkpad_acpi.fan_control=1 nvme_core.io_timeout=30 nvme_core.admin_timeout=30 init_on_alloc=0 init_on_free=0 mitigations=off usb-storage.delay_use=0 psmouse.synaptics_intertouch=1 nvme_core.default_ps_max_latency_us=25000"
# linux-t480: nvme, ext4 and i915 are built in, no initramfs; t480-init
# mounts /proc and /sys before s6 (Artix services assume they exist)
set cmdline_t480="root=PARTUUID=35f47f1c-01 rootfstype=ext4 rootwait resume=PARTUUID=35f47f1c-02 resumewait init=/usr/local/sbin/t480-init $cmdline_common"
# distro kernels boot through their initramfs
set cmdline="root=UUID=$rootuuid $cmdline_common rd.udev.log_level=0 resume=UUID=122ecbd4-bf3c-4573-8371-75698aad8556 initcall_blacklist=init_tis"

set gfxpayload=keep
set default="artix-t480"
set fallback="artix-linux"

if [ "$menu" = 0 ]; then
	# The NVMe driver now gives up instead of waiting forever; a read that
	# fails right after the controller came up gets two more tries.
	for try in 1 2 3; do
		if [ "$t480_loaded" != 1 ]; then
			if search --no-floppy --fs-uuid --set=root $rootuuid; then
				if time linux /boot/vmlinuz-linux-t480 $cmdline_t480; then
					set t480_loaded=1
				fi
			fi
			if [ "$t480_loaded" != 1 ]; then
				sleep 1
			fi
		fi
	done
	# GRUB phase timing, cbmem console only (cbmem -1)
	boottime
	set timeout_style=hidden
	set timeout=0
else
	insmod png
	# the built-in font is ASCII only: the menu border and arrows were ?
	loadfont (cbfsdisk)/font.pf2
	terminal_output --append gfxterm
	if [ -f (cbfsdisk)/background.png ]; then
		background_image (cbfsdisk)/background.png
	fi
	# the keyboard starts answering ~2.5 s after power-on
	set timeout_style=menu
	set timeout=15
fi

menuentry 'Artix Linux (linux-t480)  [t]' --id 'artix-t480' --hotkey='t' {
	if [ "$t480_loaded" != 1 ]; then
		search --no-floppy --fs-uuid --set=root $rootuuid
		linux	/boot/vmlinuz-linux-t480 $cmdline_t480
	fi
}
menuentry 'Artix Linux (linux, stock)  [l]' --id 'artix-linux' --hotkey='l' {
	if search --no-floppy --fs-uuid --set=root $rootuuid; then
		linux	/boot/vmlinuz-linux $cmdline
		initrd	/boot/initramfs-linux.img
	fi
}
menuentry 'Artix Linux (linux-lts)  [L]' --id 'artix-linux-lts' --hotkey='L' {
	if search --no-floppy --fs-uuid --set=root $rootuuid; then
		linux	/boot/vmlinuz-linux-lts $cmdline
		initrd	/boot/initramfs-linux-lts.img
	fi
}
menuentry 'Play Doom (coreDOOM + Freedoom)  [w]' --id 'coredoom' --hotkey='w' {
	set root='cbfsdisk'
	chainloader /img/coreDOOM
}
menuentry 'Tint (Tetris)  [i]' --id 'tint' --hotkey='i' {
	set root='cbfsdisk'
	chainloader /img/tint
}
menuentry 'Pac-Man  [g]' --id 'pacman' --hotkey='g' {
	set root='cbfsdisk'
	chainloader /img/pacman
}
menuentry 'Coreinfo  [c]' --id 'coreinfo' --hotkey='c' {
	set root='cbfsdisk'
	chainloader /img/coreinfo
}
menuentry 'MemTest86+  [m]' --id 'memtest' --hotkey='m' {
	set root='cbfsdisk'
	chainloader /img/memtest
}
menuentry 'SeaBIOS (floppies, USB, disk GRUB on NVMe)  [s]' --id 'seabios' --hotkey='s' {
	set root='cbfsdisk'
	chainloader /img/seabios
}
menuentry 'Reboot  [r]' --hotkey='r' {
	reboot
}
menuentry 'Power off  [p]' --hotkey='p' {
	halt
}
