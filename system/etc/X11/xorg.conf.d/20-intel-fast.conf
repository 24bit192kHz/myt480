# iGPU on modesetting + glamor (was intel/SNA, see git master). NVIDIA PRIME
# render offload (prime-run) needs the iGPU on modesetting; the MX150 is added
# as a GPU screen by 10-nvidia-drm-outputclass.conf when `dgpu on`.
Section "Device"
  Identifier "Intel Graphics"
  Driver "modesetting"
  BusID "PCI:0:2:0"
  Option "AccelMethod" "glamor"
  Option "DRI" "3"
EndSection

# modesetting names outputs eDP-1, DP-1, ... (intel: eDP1, DP1, ...)
# External DP/HDMI outputs are not ignored: chadwm scripts/monitor.sh puts a
# connected one at its native size, highest refresh, left of eDP-1.
Section "Monitor"
  Identifier "eDP-1"
  Option "Enable" "true"
EndSection

Section "Module"
  Disable "dri"
  Disable "dbe"
  Disable "record"
EndSection

Section "Extensions"
  Option "MIT-SCREEN-SAVER" "Disable"
  Option "DOUBLE-BUFFER" "Disable"
  Option "RECORD" "Disable"
EndSection

Section "ServerFlags"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
  # The MX150 is powered on demand (gpu-power): X must not hold its DRM device
  Option "AutoAddGPU" "false"
EndSection

Section "Files"
  FontPath "built-ins"
EndSection
