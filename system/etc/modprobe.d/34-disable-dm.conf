# no mapper devices (dmsetup empty, fstab UUID-only); crypttab comments-only
# saves dm_mod load ~30ms; revert: rm file + mkinitcpio -P
blacklist dm_mod
install dm_mod /bin/false
blacklist dm_snapshot
install dm_snapshot /bin/false
blacklist dm_mirror
install dm_mirror /bin/false
blacklist dm_thin_pool
install dm_thin_pool /bin/false
