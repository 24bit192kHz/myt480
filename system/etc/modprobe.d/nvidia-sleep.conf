# Overrides /usr/lib/modprobe.d/nvidia-sleep.conf (nvidia-580xx-utils); same
# values as the package, kept here so the choice is visible.
#
# The video memory has to be saved across suspend: coreboot cuts the power of
# the GPU in S3, and without this a program that is using the GPU comes back
# broken (Xid 13, seen 2026-09-29 with =0). The driver then only suspends after
# "suspend" was written to /proc/driver/nvidia/suspend, which the elogind hook
# /usr/lib/elogind/system-sleep/nvidia does. Suspend through elogind
# (loginctl suspend, lid, power menu), not by writing /sys/power/state.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
