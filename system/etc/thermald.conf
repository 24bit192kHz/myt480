# thermald.conf — unified fan + undervolt + RAPL (T480 i7-8650U)
# Values copied verbatim from live /etc/throttled.conf + /etc/thinkfan.yaml
temp_path auto
ac_glob /sys/class/power_supply/AC*/online
poll_s 3
ac_pl1_w 64
ac_pl1_s 28
ac_pl2_w 90
ac_pl2_s 0.002
ac_trip 95
ac_interval 3
batt_pl1_w 15
batt_pl1_s 28
batt_pl2_w 25
batt_pl2_s 0.002
batt_trip 85
batt_interval 6
uv_core 0
uv_cache 0
uv_gpu 0
uv_uncore 0
uv_analogio 0
icc_core_ac 64
icc_gpu_ac 31
icc_cache_ac 6
icc_core_batt 40
icc_gpu_batt 24
icc_cache_batt 6
fan_levels 2:0:38,4:36:48,6:46:56,7:54:72,8:70:32767
