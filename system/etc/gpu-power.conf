# Clock offsets of the MX150 in MHz, set by gpu-power (NVML) after each driver load,
# for the current power source. Ranges accepted: gpc -200..300, mem -1000..2000.
# Found with firmware/tools/gpu (2026-10-01, on AC): graphics +250 passed, +300 stalled
# rendering; memory scaled linearly to +1500, no gain at +1750. Daily values keep two
# steps of margin and passed a 15-minute soak together (no Xid, no stall).
# 2026-10-02: 15-minute soaks with render checksums and self-verifying CUDA samples: +200 and +225
# clean (48/48 CUDA runs at +225), +250 gave silent CUDA errors (scan failed 4 of 6 rounds).
# Daily +200: one step below the last clean value, two below the first failure.
ac_gpc_offset 200
# Memory, same tests at core +200: +1250 and +1500 clean and scaling with the clock; +1750 is the
# GDDR5 retry knee (device-to-device copy drops, transpose flat). Daily +1250, as for the core.
ac_mem_offset 1250
# On battery the GPU runs at stock clocks (efficiency).
batt_gpc_offset 0
batt_mem_offset 0

# Runtime D3 (NVIDIA coarse-grained): with the driver loaded the GPU powers itself off
# (D3cold) whenever no program has it open and wakes in well under a second. 1 = on.
# Takes effect at the next driver load (gpu-power off; gpu-power auto).
# Off here: the clock offsets do not survive a runtime suspend (NVML reads 0/0 after
# a wake), and on AC the offsets (+7..17 %) are worth more than the ~1 W it saves.
rtd3 0
