#!/usr/bin/nft -f
# Inbound firewall. Own table, input hook only: Docker's iptables-nft chains and
# anything else that filters forwarding or output are not touched.
# Loaded by /etc/local.d/firewall.start. Remove: nft delete table inet t480
table inet t480
delete table inet t480
table inet t480 {
	chain input {
		type filter hook input priority filter; policy drop;
		iifname "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 68 accept
		udp dport 546 accept
		# own bridges: containers and VMs
		iifname { "docker0", "virbr0" } accept
		iifname "br-*" accept
		iifname "virbr*" accept
		# SSH only from the machines you name here (example addresses)
		ip saddr { 192.0.2.10, 192.0.2.11 } tcp dport 22 accept
	}
}
